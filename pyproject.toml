[project]
name = "entirius-py-magento2-sdk"
version = "2.0.0"
description = "Magento 2 REST API client for orders, invoices and shipments, part of the Entirius ecommerce platform"
keywords = ["magento", "magento2", "rest-api", "sdk", "orders", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "requests>=2.28.1",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-py-magento2-sdk"
Changelog = "https://github.com/entirius/entirius-py-magento2-sdk/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-py-magento2-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magento2_sdk"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy SDK migrated 1:1 — deferred cleanup:
"src/magento2_sdk/client.py" = ["S113"]                 # requests without timeout
"src/magento2_sdk/dto/__init__.py" = ["S102"]           # exec for dynamic base_* attrs
"src/magento2_sdk/services/invoice.py" = ["B008", "F821"]  # call-in-default; dead "Invoice" type hint
"src/magento2_sdk/services/order.py" = ["B006", "B008"]
"tests/**" = ["S101", "S105", "S106", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["magento2_sdk"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
